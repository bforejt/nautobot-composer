---
# Nautobot — Docker Compose
# Supports Nautobot 2.4, 3.0, and 3.1 — select the version via ./setup.sh -v,
# which writes NAUTOBOT_VERSION into .env where this file picks it up below.
# Docs: https://docs.nautobot.com/projects/core/en/stable/user-guide/administration/guides/docker/

x-nautobot-build: &nautobot-build
  build:
    context: .
    dockerfile: Dockerfile
    # The :? operator makes Compose abort with a clear error if the
    # variable is missing (e.g. if the user runs `docker compose build`
    # without first running setup.sh to generate .env).
    args:
      NAUTOBOT_VERSION: ${NAUTOBOT_VERSION:?NAUTOBOT_VERSION is not set. Run ./setup.sh first to generate .env.}

x-nautobot-env: &nautobot-env
  env_file:
    - .env

x-nautobot-depends: &nautobot-depends
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

# Shared logging config — cap per-container log growth so long-running
# lab and production deployments don't fill the host disk.  Applied to
# every service via the *default-logging YAML anchor.  Adjust upward
# if you rely on long retention and prefer an external log aggregator.
x-default-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-nautobot-volumes: &nautobot-volumes
  volumes:
    - nautobot_media:/opt/nautobot/media
    - nautobot_git:/opt/nautobot/git
    # Bind-mount ./jobs into the container's JOBS_ROOT so custom Jobs can
    # be added to the project and version-controlled alongside the rest
    # of the deployment.  See ./jobs/README.md for details.
    - ./jobs:/opt/nautobot/jobs
    # Bind-mount ./secrets for Nautobot's built-in "text file" secrets
    # provider: a Secret record pointing at /opt/nautobot/secrets/<name> is
    # read at ACCESS time (job run / UI check), so dropping a new file on
    # the host — './add-secret.sh <name>' — adds or rotates a secret with no
    # container restart.  Read-only: nothing in the stack writes secrets.
    # See ./secrets/README.md and the README's "Secrets Management" section.
    - ./secrets:/opt/nautobot/secrets:ro
    # Bind-mount the config so edits only need a restart (not a rebuild).
    # The Dockerfile also COPYs this file so the image stays self-contained
    # if this line is removed (e.g. for shipping a standalone production
    # image).  Read-only: Nautobot never writes to its config file.
    - ./nautobot_config.py:/opt/nautobot/nautobot_config.py:ro
    # Web TLS cert/key served by uWSGI on :8443 (see uwsgi.ini in the image:
    # "https = 0.0.0.0:8443,<crt>,<key>").  These override the image's baked
    # self-signed pair with the files in ./certs — drop a CA-issued cert there
    # to remove the browser warning, then restart nautobot.  setup.sh generates
    # a self-signed fallback so the mount source always exists.  See
    # ./certs/README.md.  (Only the nautobot web service uses these; the celery
    # containers share this anchor and simply ignore them.)
    - ./certs/nautobot.crt:/opt/nautobot/nautobot.crt:ro
    - ./certs/nautobot.key:/opt/nautobot/nautobot.key:ro

services:
  # --------------------------------------------------------------------------
  # Nautobot — Web Application Server (uWSGI)
  # --------------------------------------------------------------------------
  nautobot:
    <<: [*nautobot-build, *nautobot-env, *nautobot-depends, *nautobot-volumes, *default-logging]
    container_name: nautobot
    # HTTPS only.  The plain-HTTP mapping (80:8080) was removed on purpose:
    # host port 80 is reserved for the firmware device-download endpoint,
    # whose HTTP consumers can't always specify a port, and serving the web
    # UI without TLS wasn't worth supporting anyway.  The container still
    # listens on 8080 internally (healthcheck below, prod Caddy overlay).
    ports:
      - "443:8443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/"]
      interval: 30s
      timeout: 10s
      retries: 10
      # First start runs migrations for all installed Apps, which can take
      # a long time depending on the number of Apps and host performance.
      # start_period tells Docker not to count failures until this window
      # passes; it has no effect on normally fast restarts.
      start_period: 900s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Celery Worker — Background Task Execution
  # --------------------------------------------------------------------------
  celery_worker:
    <<: [*nautobot-build, *nautobot-env, *nautobot-depends, *nautobot-volumes, *default-logging]
    container_name: nautobot-celery-worker
    command: nautobot-server celery worker --loglevel INFO --events
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nautobot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "nautobot-server celery inspect ping --destination celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Celery Beat — Scheduled Task Orchestration
  # --------------------------------------------------------------------------
  celery_beat:
    <<: [*nautobot-build, *nautobot-env, *nautobot-depends, *nautobot-volumes, *default-logging]
    container_name: nautobot-celery-beat
    command: nautobot-server celery beat --loglevel INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nautobot:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "test -f /tmp/celerybeat.pid && kill -0 $(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # PostgreSQL 17 — Primary Database
  # Required minimums: Nautobot 2.4 → 12+, Nautobot 3.0 → 14+, Nautobot 3.1 → 14+
  # PostgreSQL 17 is compatible with all supported Nautobot versions and is
  # officially supported by Django 5.2 (which Nautobot 3.x is built on).
  # --------------------------------------------------------------------------
  db:
    <<: *default-logging
    image: postgres:17-alpine
    container_name: nautobot-db
    env_file:
      - .env
    volumes:
      - nautobot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Valkey 8 — Cache, Celery Broker, and Lock Backend
  # --------------------------------------------------------------------------
  # Valkey is a BSD-licensed fork of Redis 7.2, maintained by the Linux
  # Foundation (AWS, Google, Oracle, et al).  It is drop-in compatible with
  # the Redis wire protocol — Django and Celery don't know the difference.
  # Chosen here over Redis 7.x/8.x because those are source-available
  # (RSALv2/SSPLv1) or AGPLv3, which can cause friction for commercial
  # downstream users.  Service/hostname/volume stay named "redis" since
  # other services address it via NAUTOBOT_REDIS_HOST=redis.
  # --------------------------------------------------------------------------
  redis:
    <<: *default-logging
    image: valkey/valkey:8-alpine
    container_name: nautobot-redis
    env_file:
      - .env
    # REDIS_MAXMEMORY is sourced from .env (default: 512mb — see env.example).
    command: >
      valkey-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - nautobot_redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # GitLab CE — Git Repository Server (opt-in)
  # --------------------------------------------------------------------------
  # Start with:  docker compose --profile gitlab up
  # First boot takes several minutes while GitLab runs internal configuration.
  gitlab:
    <<: *default-logging
    image: gitlab/gitlab-ce:latest
    container_name: nautobot-gitlab
    profiles:
      - gitlab
    ports:
      - "8080:80"
      - "8443:443"
      - "2222:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8080'
        # Keep nginx listening on port 80 inside the container; Docker
        # maps host 8080 → container 80.  Without this, GitLab parses
        # the port from external_url and tries to bind nginx to 8080
        # internally, conflicting with Puma.
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        # Reduce resource usage for lab/small deployments.
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Firmware Server — Filebrowser UI (authenticated management)  [profile: firmware]
  # --------------------------------------------------------------------------
  # Opt-in via the "firmware" profile — does NOT start by default.  Enable with:
  #   docker compose --profile firmware up -d
  # Hosts network-device firmware images: this authenticated Filebrowser UI for
  # engineers, plus the read-only firmware-download endpoint below for devices,
  # sharing ONE volume (nautobot_firmware).  Nautobot itself is not modified —
  # the device-download URL is what you store in Nautobot's
  # dcim.SoftwareImageFile.download_url (or register via the
  # "Register IOS-XE Image" job).  Tunables live in .env (FIRMWARE_*; see
  # env.example); config files are under ./firmware/.
  # Note: FIRMWARE_BASE_URL in .env is not consumed by these two services —
  # it rides the shared env_file into the Nautobot containers, where the
  # Celery worker's Register Image job uses it to build device download URLs.
  firmware-filebrowser:
    <<: *default-logging
    image: filebrowser/filebrowser:v2.63.17
    container_name: nautobot-firmware-filebrowser
    profiles:
      - firmware
    # Bootstrap the admin user from env on first run only (the DB is created
    # once and persisted in nautobot_firmware_db).  Credentials NEVER appear in
    # this file — they come from .env via the environment block below.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        DB=/database/filebrowser.db
        if [ ! -f "$$DB" ]; then
          echo "firmware: initialising Filebrowser database and admin user"
          /bin/filebrowser -d "$$DB" config init
          # World-readable files/dirs (0644/0755) so the read-only nginx
          # download service (which runs as a different uid) can serve them.
          # Firmware images are public artefacts pulled unauthenticated by
          # devices, so this is intentional, not a leak.
          /bin/filebrowser -d "$$DB" config set --auth.method=json --root /srv --fileMode 0o644 --dirMode 0o755
          /bin/filebrowser -d "$$DB" users add "$$FB_USERNAME" "$$FB_PASSWORD" --perm.admin
        fi
        exec /bin/filebrowser -d "$$DB" -r /srv -a 0.0.0.0 -p 80
    environment:
      FB_USERNAME: "${FIRMWARE_ADMIN_USER:-admin}"
      FB_PASSWORD: "${FIRMWARE_ADMIN_PASSWORD:?Set FIRMWARE_ADMIN_PASSWORD in .env (see env.example)}"
    volumes:
      - nautobot_firmware:/srv
      - nautobot_firmware_db:/database
    ports:
      # Authenticated UI.  Bind to FIRMWARE_BIND_ADDRESS (default all
      # interfaces); restrict to a management-interface IP for tighter control.
      - "${FIRMWARE_BIND_ADDRESS:-0.0.0.0}:${FIRMWARE_FILEBROWSER_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "/bin/filebrowser", "version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Firmware Server — nginx device-download endpoint (read-only)  [profile: firmware]
  # --------------------------------------------------------------------------
  # Serves the SAME files read-only, unauthenticated but network-restricted, at
  # stable device URLs:  https://<host>:<FIRMWARE_HTTPS_PORT>/images/<filename>
  # (directory listing off, application/octet-stream, GET/HEAD only, HTTP
  # fallback on FIRMWARE_HTTP_PORT).
  firmware-download:
    <<: *default-logging
    # Small custom image: nginx:1.30-alpine + openssl + the first-run helper
    # scripts baked in (see firmware/nginx/Dockerfile for why).  No explicit
    # image: name, so Compose tags it <project>-firmware-download (e.g.
    # nautobot-composer-firmware-download) like the other built images — which
    # means reset.sh's project-scoped image cleanup removes it too.  Built on
    # first 'docker compose --profile firmware up'; rebuild with '... up --build'
    # after editing a helper script.
    build:
      context: ./firmware/nginx
      dockerfile: Dockerfile
    container_name: nautobot-firmware-download
    profiles:
      - firmware
    environment:
      FIRMWARE_SERVER_NAME: "${FIRMWARE_SERVER_NAME:-localhost}"
      FIRMWARE_ALLOWED_CIDRS: "${FIRMWARE_ALLOWED_CIDRS:-0.0.0.0/0}"
      # Only substitute our own placeholders in the template; leave nginx
      # runtime vars ($host, $uri, ...) untouched.
      NGINX_ENVSUBST_FILTER: "^FIRMWARE_"
    volumes:
      # The SAME files as the UI, mounted READ-ONLY for device pulls.
      - nautobot_firmware:/srv:ro
      # Server template — bind-mounted so nginx config can be tweaked without a
      # rebuild (rendered by the official entrypoint's envsubst at start).
      - ./firmware/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # TLS material (bind mount so a generated/real cert persists on the host).
      - ./firmware/certs:/etc/nginx/certs
    ports:
      # Device-facing HTTPS and HTTP.  Bind to FIRMWARE_BIND_ADDRESS.
      # HTTP defaults to host port 80 — some HTTP consumers can't specify a
      # port, and the Nautobot web service no longer publishes 80 (HTTPS
      # only).  NOTE: the prod Caddy overlay also wants host port 80.  To
      # combine it with the firmware profile, move FIRMWARE_HTTP_PORT to a
      # free port AND make sure FIRMWARE_HTTP_LEGACY_PORT is set in .env
      # (setup.sh writes it; if it is missing it defaults to 80 below and
      # would re-publish 80 anyway) — or bind the firmware ports to a
      # dedicated interface IP via FIRMWARE_BIND_ADDRESS.
      - "${FIRMWARE_BIND_ADDRESS:-0.0.0.0}:${FIRMWARE_HTTPS_PORT:-9443}:443"
      - "${FIRMWARE_BIND_ADDRESS:-0.0.0.0}:${FIRMWARE_HTTP_PORT:-80}:80"
      # Legacy HTTP port — backward compatibility for download_urls registered
      # in Nautobot before the endpoint moved to port 80 (they embed :9080).
      # Same container listener, same content.  setup.sh writes 9080 into .env
      # for existing installs; retire it once no stored download_url references
      # :9080 (ports: !override in docker-compose.override.yml).
      #
      # The DEFAULT here is deliberately 80, not 9080: an .env that still pins
      # FIRMWARE_HTTP_PORT=9080 (not yet migrated) would otherwise render this
      # line identically to the one above, and Compose's dedupe would leave the
      # stack with NO port-80 publish at all — silently defeating the move.
      # Defaulting to 80 makes an unset legacy port a harmless no-op instead.
      - "${FIRMWARE_BIND_ADDRESS:-0.0.0.0}:${FIRMWARE_HTTP_LEGACY_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # NFV Answer Service — bare-metal install engine  [profile: answer-service]
  # --------------------------------------------------------------------------
  # Opt-in: docker compose --profile answer-service up -d --build
  # The SoT-backed brain of the nautobot-proxmox bare-metal install loop: the
  # Proxmox auto-installer POSTs a machine's identity here; this service
  # matches it against Nautobot (serial allowlist) and renders a per-node
  # answer file, then receives the firstboot credential phone-home (per-node
  # API token -> text-file Secrets + SecretsGroup) and the post-install
  # webhook (provisioning_state).  Full docs: nautobot-proxmox repo,
  # docs/baremetal-install.md.
  #
  # Build context is the SIBLING nautobot-proxmox checkout (override with
  # ANSWER_SERVICE_BUILD_CONTEXT if yours lives elsewhere).
  #
  # NOTE on ./secrets: the stack's rule is "nothing writes secrets" — this
  # service is the deliberate exception.  It writes ONLY under
  # ./secrets/nodes/ (per-node Proxmox API tokens captured at firstboot) and
  # reads ./secrets/root_password_hash.  Nautobot still mounts the same
  # directory read-only.
  answer-service:
    <<: *default-logging
    build:
      context: ${ANSWER_SERVICE_BUILD_CONTEXT:-../nautobot-proxmox/bmc}
      dockerfile: answer_service/Dockerfile
    container_name: answer-service
    profiles:
      - answer-service
    depends_on:
      nautobot:
        condition: service_healthy
      # Fail `up` fast (with a clear message) when the required .env values are
      # missing — see answer-service-preflight below.
      answer-service-preflight:
        condition: service_completed_successfully
    # Deliberately NOT env_file: .env — the stack .env holds DB credentials
    # this service has no business seeing.  Explicit environment only.
    environment:
      NAUTOBOT_URL: "http://nautobot:8080"
      # Required at runtime, but NOT guarded with ${VAR:?} here: that guard
      # fires on EVERY compose command (down/config/stop included), which
      # wedges teardown when the token is unset.  answer-service-preflight
      # enforces "must be set" only on `up` instead.
      NAUTOBOT_TOKEN: "${ANSWER_NAUTOBOT_TOKEN:-}"
      # How NODES reach this service — LAN address, not localhost.
      PUBLIC_URL: "${ANSWER_PUBLIC_URL:-}"
      # SHA256 of the TLS cert below; also baked into prepared installer
      # media via prepare-install-iso.sh --fingerprint.
      CERT_FINGERPRINT: "${ANSWER_CERT_FINGERPRINT:-}"
      SSL_CERTFILE: /tls/answer-service.crt
      SSL_KEYFILE: /tls/answer-service.key
      ROOT_PASSWORD_HASH_FILE: /secrets/root_password_hash
      SECRETS_DIR: /secrets/nodes
      NAUTOBOT_SECRETS_PATH: /opt/nautobot/secrets/nodes
      DOMAIN: "${ANSWER_DOMAIN:-nfv.lab}"
      TIMEZONE: "${ANSWER_TIMEZONE:-America/Chicago}"
    volumes:
      # One-time-key store + install-report archive.  Losing it mid-install
      # strands a node between answer and phone-home — keep it durable.
      - nautobot_answer_data:/data
      - ./secrets:/secrets
      # TLS keypair (generate once; the cert's SHA256 fingerprint is baked
      # into prepared installer media — regenerating the cert means
      # re-preparing the ISOs/PXE artifacts).  Git-ignored.
      - ./answer-service/certs:/tls
    ports:
      - "${ANSWER_BIND_ADDRESS:-0.0.0.0}:${ANSWER_PORT:-8800}:8800"
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request as u; u.urlopen('https://localhost:8800/healthz', context=ssl._create_unverified_context(), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # TACACS+ Server — device AAA (tac_plus-ng)  [profile: tacacs]
  # --------------------------------------------------------------------------
  # Opt-in: ./setup.sh --with-tacacs   (or: docker compose --profile tacacs up -d --build)
  # Cisco devices authenticate/authorize against this daemon (RFC 8907, TCP/49).
  # Users live in Active Directory (upstream's own Python MAVIS LDAP backend —
  # binds as the user, so AD lockout/expiry policy applies; nested memberOf
  # groups map to privilege profiles).  Device inventory and per-device keys
  # are AUTHORED IN NAUTOBOT and rendered into the daemon's config by an
  # in-container render loop (validated with `tac_plus-ng -P` before every
  # reload — a bad render can never take AAA down; if Nautobot is unreachable
  # the last-good config keeps serving).  See README: TACACS+ Server.
  #
  # Availability contract: deliberately NO depends_on — device login must not
  # wait for (or die with) the rest of the stack.
  tacacs:
    <<: *default-logging
    build:
      context: ./tacacs
      dockerfile: Dockerfile
    container_name: nautobot-tacacs
    profiles:
      - tacacs
    # Explicit environment only (answer-service precedent): this container has
    # no business reading the stack-wide .env with DB credentials.
    environment:
      NAUTOBOT_URL: "http://nautobot:8080"
      # Renderer activation (empty = static seed config, render loop idle).
      TACACS_NAUTOBOT_TOKEN: "${TACACS_NAUTOBOT_TOKEN:-}"
      TACACS_DEVICE_TAG: "${TACACS_DEVICE_TAG:-tacacs}"
      TACACS_RENDER_INTERVAL: "${TACACS_RENDER_INTERVAL:-300}"
      # Days of accounting/access logs to keep (date-bucketed); 0 = keep all.
      TACACS_LOG_RETENTION_DAYS: "${TACACS_LOG_RETENTION_DAYS:-30}"
      # RFC 8907 §10.5.1: servers MUST support keys of at least 32 chars —
      # setup.sh generates 32.  The :? guard fails fast on a hand-made .env.
      TACACS_DEFAULT_KEY: "${TACACS_DEFAULT_KEY:?Set TACACS_DEFAULT_KEY in .env (see env.example)}"
      TACACS_OPEN_DEFAULT: "${TACACS_OPEN_DEFAULT:-true}"
      # Active Directory (MAVIS LDAP backend) — all optional until field config.
      TACACS_AD_URLS: "${TACACS_AD_URLS:-}"
      LDAP_HOSTS: "${TACACS_AD_URLS:-}"
      LDAP_BASE: "${TACACS_AD_BASE_DN:-}"
      LDAP_USER: "${TACACS_AD_BIND_DN:-}"
      LDAP_PASSWD: "${TACACS_AD_BIND_PASSWORD:-}"
      # AD group -> privilege mapping (rendered into the ruleset).
      TACACS_ADMIN_GROUP: "${TACACS_ADMIN_GROUP:-}"
      TACACS_READONLY_GROUP: "${TACACS_READONLY_GROUP:-}"
    volumes:
      # Rendered config (last-good survives restarts) + accounting logs.
      - nautobot_tacacs:/var/lib/tac_plus-ng
      # Per-device PSK files ONLY (./secrets/tacacs/<device>.key — the files
      # Nautobot Secret objects of the text-file provider point at).  Scoped to
      # this subdir on purpose: the AAA daemon must not see the rest of
      # ./secrets (answer-service node tokens, root password hash, etc.).
      # Read-only.  setup.sh creates ./secrets/tacacs so the bind source exists.
      - ./secrets/tacacs:/secrets/tacacs:ro
    ports:
      - "${TACACS_BIND_ADDRESS:-0.0.0.0}:${TACACS_PORT:-49}:49"
    # Defense-in-depth: tac_plus-ng parses untrusted network packets, and this
    # upstream has no config/CLI privilege-drop, so it runs as root (like the
    # repo's other built images).  no-new-privileges blocks setuid escalation;
    # deploy on an isolated management network (RFC 8907 §10.5) as documented.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/tacacs-healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Answer Service — preflight (fail `up` fast on missing config)  [profile: answer-service]
  # --------------------------------------------------------------------------
  # A one-shot that runs before answer-service and exits non-zero (blocking the
  # start) if the required .env values are missing.  This replaces the
  # ${ANSWER_NAUTOBOT_TOKEN:?} / ${ANSWER_PUBLIC_URL:?} interpolation guards,
  # which fire on EVERY compose command — including `down`, `stop`, and
  # `config` — and so would wedge teardown when the token isn't set yet.  A
  # dependency one-shot only runs on `up`, so teardown is never blocked while
  # `up` still fails immediately with a clear message.
  answer-service-preflight:
    image: alpine:3.22
    container_name: answer-service-preflight
    profiles:
      - answer-service
    environment:
      ANSWER_NAUTOBOT_TOKEN: "${ANSWER_NAUTOBOT_TOKEN:-}"
      ANSWER_PUBLIC_URL: "${ANSWER_PUBLIC_URL:-}"
    command:
      - sh
      - -c
      - |
        missing=
        [ -n "$$ANSWER_NAUTOBOT_TOKEN" ] || missing="$$missing ANSWER_NAUTOBOT_TOKEN"
        [ -n "$$ANSWER_PUBLIC_URL" ]     || missing="$$missing ANSWER_PUBLIC_URL"
        if [ -n "$$missing" ]; then
          echo "answer-service: refusing to start — unset required .env value(s):$$missing" >&2
          echo "  Set them in .env (see env.example / answer-service/README.md), then retry." >&2
          exit 1
        fi
        echo "answer-service preflight OK"
    restart: "no"

volumes:
  nautobot_postgres_data:
    external: true
  nautobot_redis_data:
    external: true
  nautobot_media:
    external: true
  nautobot_git:
    external: true
  # nautobot_jobs: replaced by a bind mount to ./jobs (see x-nautobot-volumes)
  gitlab_config:
    external: true
  gitlab_logs:
    external: true
  gitlab_data:
    external: true
  # Firmware server (profile: firmware).  Compose-managed (NOT external), so
  # these are created only when the firmware profile is selected — keeping the
  # default stack's storage unchanged.  They survive container restarts.
  nautobot_firmware:
  # Filebrowser's own DB (users/settings), kept off the shared volume so it is
  # never exposed by the download endpoint.
  nautobot_firmware_db:
  # Answer service (profile: answer-service): one-time keys + install reports.
  nautobot_answer_data:
  # TACACS+ server (profile: tacacs): rendered last-good config + accounting logs.
  nautobot_tacacs:

networks:
  # Pin the project's network to a fixed, non-conflicting subnet instead of
  # letting Docker auto-carve a /16 from its default pool (172.17.0.0/16,
  # 172.18.0.0/16, ...), which can collide with company address space.
  # Default: 192.0.2.0/24 (RFC 5737 TEST-NET-1 — reserved for documentation,
  # so it should never appear in real routed networks).  Docker assigns the
  # gateway (.1) automatically; containers get .2 onward.  Override the range
  # per-deployment with NAUTOBOT_NETWORK_SUBNET in .env.
  #
  # NOTE: changing this on an already-running stack requires recreating the
  # network — `docker compose down && docker compose up -d` (data volumes are
  # untouched).  This does NOT affect Docker's own docker0 bridge or other
  # Compose projects; to move those too, set default-address-pools in the
  # daemon's /etc/docker/daemon.json (see README: Networking).
  default:
    ipam:
      config:
        - subnet: ${NAUTOBOT_NETWORK_SUBNET:-192.0.2.0/24}
